<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1D9E75"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="description" content="TeamAssist — المنصة المتكاملة لإدارة الفرق الرياضية"/>
  <title>TeamAssist — إدارة الفرق</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

    body { margin: 0; background: #F0F4F8; }

    /* ── Splash screen ── */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #064e3b 0%, #0f766e 45%, #1D9E75 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    #splash-logo {
      width: 96px; height: 96px; border-radius: 28px;
      object-fit: cover; object-position: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      animation: splashPulse 1.8s ease-in-out infinite;
    }
    #splash-title {
      color: white; font-size: 30px; font-weight: 800;
      margin: 18px 0 4px; letter-spacing: -0.5px;
    }
    #splash-sub {
      color: rgba(255,255,255,0.65); font-size: 14px;
      margin: 0 0 36px; font-weight: 500;
    }

    /* Modern spinner */
    .splash-spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      animation: spin 0.75s linear infinite;
    }

    /* Decorative background circles */
    #splash::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      top: -80px; right: -80px;
    }
    #splash::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -50px; left: -50px;
    }

    @keyframes spin         { to   { transform: rotate(360deg); } }
    @keyframes splashPulse  { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <img id="splash-logo" src="/logo.png" alt="TeamAssist"
      onerror="this.style.display='none'"/>
    <h1 id="splash-title">TeamAssist</h1>
    <p id="splash-sub">المنصة الرياضية الذكية</p>
    <div class="splash-spinner"></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash')
        if (splash) splash.classList.add('hidden')
      }, 1400)
    })
  </script>
</body>
</html>
